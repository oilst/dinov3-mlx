[project]
name = "dinov3-mlx"
version = "0.1.0"
description = "Fast DINOv3 frame embeddings, patch embeddings and fine-tuning on Apple silicon with MLX."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DINOv3.md"]
authors = [
    { name = "Ueli Peter" }
]
requires-python = ">=3.12"
# The packages of the API path. uv.lock keeps the tested versions (README, "Tested versions").
dependencies = [
    "huggingface-hub>=2.4.0,<3",
    "mlx>=0.32.4,<0.33",
    "numpy>=2.5.4,<3",
    "pillow>=13.0.0,<14",
    "safetensors>=0.8.0,<0.9",
]

[project.optional-dependencies]
# The reference outputs and the torch-mps baseline (scripts/make_reference.py, scripts/benchmark.py).
reference = [
    "torch>=2.15.0,<2.16",
    "transformers>=5.22.1,<6",
]

[project.urls]
Homepage = "https://github.com/oilst/dinov3-mlx"
Documentation = "https://oilst.github.io/dinov3-mlx/"
Issues = "https://github.com/oilst/dinov3-mlx/issues"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
coreml = [
    "coremltools==9.0",
]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "torch==2.15.0",
    "transformers==5.22.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = ["mlx: a test of the backend mlx. uv run pytest -m mlx runs only these tests."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
